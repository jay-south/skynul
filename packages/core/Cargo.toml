[package]
name = "skynul-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skynul-core"
path = "src/bin/cli.rs"

[[bin]]
name = "skynul-server"
path = "src/bin/server.rs"

[[bin]]
name = "typeshare-gen"
path = "src/bin/typeshare-gen.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.2", features = ["sqlite", "r2d2", "chrono", "uuid", "serde_json", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
typeshare = "1.0"
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
typeshare-cli = "1.0"
